openapi: 3.0.3
info:
  title: 송금/결제 플랫폼 API
  description: |
    MSA 기반 실시간 송금/결제 플랫폼의 API 스펙 초안입니다.
    Account / Transfer / Ledger 세 서비스가 API Gateway 뒤에서 각자의 경계 컨텍스트를 갖고,
    이 문서는 Gateway가 외부에 노출하는 통합 계약(contract)을 정의합니다.
  version: 0.1.0
servers:
  - url: https://api.remittance.local/v1
    description: API Gateway (Spring Cloud Gateway + Netty)

tags:
  - name: Account
    description: 계좌 생성/조회, 잔액 관리 (Spring MVC + JPA + MySQL)
  - name: Transfer
    description: 송금 요청/조회, Saga 오케스트레이션 (Spring MVC + Redis)
  - name: Ledger
    description: 거래 내역 조회 (Spring WebFlux + MongoDB, 읽기 트래픽 최적화)

paths:
  # ────────────────────────────── Account Service ──────────────────────────────
  /accounts:
    post:
      tags: [Account]
      summary: 계좌 생성
      description: 신규 계좌를 개설합니다. 초기 잔액은 0으로 시작합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: 계좌 생성 완료
          headers:
            Location:
              schema:
                type: string
              description: 생성된 계좌 리소스 URI (/accounts/{accountId})
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이미 존재하는 사용자의 동일 통화 계좌 (정책에 따라 중복 허용/제한)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountId}:
    get:
      tags: [Account]
      summary: 계좌 조회
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{accountId}/balance:
    get:
      tags: [Account]
      summary: 잔액 조회
      description: Redis 캐시를 우선 조회하고, 캐시 미스 시 MySQL 원본을 조회합니다.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ────────────────────────────── Transfer Service ──────────────────────────────
  /transfers:
    post:
      tags: [Transfer]
      summary: 송금 요청
      description: |
        송금을 요청합니다. Saga 오케스트레이션으로 출금 → 입금 → 원장 기록 순으로 진행되며,
        중간 단계 실패 시 보상 트랜잭션(출금 롤백)이 수행됩니다.
        `Idempotency-Key` 헤더는 필수이며, 동일 키로 재요청 시 최초 처리 결과를 그대로 반환합니다.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 클라이언트가 생성하는 UUID. 중복 송금 방지를 위한 멱등성 키.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '202':
          description: |
            송금 요청 접수 완료 (비동기 처리). 최종 상태는 GET /transfers/{transferId}로 폴링하거나
            웹훅/이벤트 구독으로 확인합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 잔액 부족 또는 동시 요청으로 인한 즉시 거절
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 동일 Idempotency-Key로 다른 payload 재요청 (충돌)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transfers/{transferId}:
    get:
      tags: [Transfer]
      summary: 송금 상태 조회
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ────────────────────────────── Ledger Service ──────────────────────────────
  /accounts/{accountId}/transactions:
    get:
      tags: [Ledger]
      summary: 계좌별 거래 내역 조회 (커서 기반 페이지네이션)
      description: WebFlux 기반 논블로킹 조회. 대량 조회 트래픽 및 백프레셔를 고려한 커서 방식 페이지네이션을 사용합니다.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: cursor
          in: query
          description: 이전 응답의 nextCursor 값. 최초 조회 시 생략.
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /transactions/{transactionId}:
    get:
      tags: [Ledger]
      summary: 거래 상세 조회
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 요청 형식 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CreateAccountRequest:
      type: object
      required: [ownerId, currency]
      properties:
        ownerId:
          type: string
          format: uuid
        currency:
          type: string
          example: KRW
        accountType:
          type: string
          enum: [PERSONAL, BUSINESS]
          default: PERSONAL

    AccountResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        currency:
          type: string
        accountType:
          type: string
        status:
          type: string
          enum: [ACTIVE, FROZEN, CLOSED]
        createdAt:
          type: string
          format: date-time

    BalanceResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        balance:
          type: number
          format: decimal
          example: 152340.00
        currency:
          type: string
        version:
          type: integer
          description: 낙관적 락에 사용되는 버전 값 (디버깅/모니터링 용도로 노출, 클라이언트 요청에는 미사용)
        asOf:
          type: string
          format: date-time

    CreateTransferRequest:
      type: object
      required: [fromAccountId, toAccountId, amount, currency]
      properties:
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
          example: 50000.00
        currency:
          type: string
          example: KRW
        memo:
          type: string
          maxLength: 100

    TransferResponse:
      type: object
      properties:
        transferId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, DEBIT_COMPLETED, CREDIT_COMPLETED, COMPLETED, COMPENSATING, FAILED]
          description: |
            PENDING → DEBIT_COMPLETED → CREDIT_COMPLETED → COMPLETED 정상 흐름.
            입금 실패 시 COMPENSATING(보상 진행 중)을 거쳐 FAILED로 종결.
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
        currency:
          type: string
        failureReason:
          type: string
          nullable: true
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    TransactionResponse:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        transferId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        direction:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: number
          format: decimal
        balanceAfter:
          type: number
          format: decimal
        recordedAt:
          type: string
          format: date-time

    TransactionPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        nextCursor:
          type: string
          nullable: true
        hasNext:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: INSUFFICIENT_BALANCE
        message:
          type: string
        traceId:
          type: string
          description: 분산 트레이싱 상관관계 ID (ELK/Envoy 트레이싱 연계)
