spring:
  application:
    name: account-service
  # datasource / redis / kafka 접속 정보는 AbstractIntegrationTest가 컨테이너 값으로 주입한다.
  jpa:
    hibernate:
      # 컨테이너가 새로 뜨면 스키마가 비어 있고, Flyway가 V1을 실행해 만든다.
      # Hibernate는 그 결과를 <b>대조만</b> 한다 — 여기서 실패하면 마이그레이션 파일이
      # 엔티티를 따라오지 못한 것이다. 운영에서 터질 일을 테스트에서 먼저 잡는다.
      ddl-auto: validate
    open-in-view: false

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # 테스트 컨텍스트마다 그룹을 나누면 오프셋이 섞이지 않는다.
      group-id: account-service-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

outbox:
  relay:
    # 릴레이가 도는 동안 Outbox 행이 사라져(=발행되어) 검증이 흔들리지 않도록 기본은 끔.
    # 발행 자체를 검증하는 테스트만 켠다.
    enabled: false
    interval-ms: 200

remittance:
  external-bank:
    urls:
      KB: http://localhost:19999
    inquiry:
      # 조회 루프가 배경에서 돌면 검증이 흔들린다. 확인하는 테스트만 직접 부른다.
      interval-ms: 3600000
      base-backoff: 10ms
      max-backoff: 50ms
      stuck-after: 1s
