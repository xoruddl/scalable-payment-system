spring:
  application:
    name: account-service
  datasource:
    url: jdbc:mysql://localhost:3306/account_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    hikari:
      # 컨슈머 스레드를 3 → 6으로 올리면서 함께 올린다 (Phase 6, 2026-08-24).
      #
      # 리스너가 셋(requested·debited·credit-failed) × 6스레드 = <b>18개가 동시에 DB를 잡는다.</b>
      # 기본값 10으로 두면 스레드를 늘린 만큼 커넥션 대기로 옮겨갈 뿐이다 —
      # transfer-service가 Step 2에서 정확히 그 상태였다(pending 193).
      #
      # 30인 이유: 18(컨슈머) + 웹 요청 + 릴레이 스케줄러에 여유를 둔 값이다.
      # 무작정 키우면 경합이 DB 안으로 옮겨가므로 재고 한 단계 올린다.
      maximum-pool-size: 30
      minimum-idle: 10
  # 스키마는 앱이 아니라 여기 있는 SQL이 만든다 (DECISIONS.md 교체 4번).
  #   src/main/resources/db/migration/V1__baseline.sql
  flyway:
    # 이미 테이블이 있는데 이력 테이블이 없으면, V1을 실행하는 대신
    # "지금 이 상태가 V1이다"라고 도장만 찍고 넘어간다.
    #
    # 이게 없으면 <b>기존 볼륨에서 뜨는 순간 기동이 실패한다</b> — Flyway는 빈 스키마를
    # 기대하는데 테이블이 이미 있으니 V1의 CREATE TABLE이 충돌한다. 홈서버 DB에는
    # 지금까지 쌓인 데이터가 있어서 지우고 시작할 수 없으므로 이 다리가 필요하다.
    #
    # 대가는 명확하다. <b>도장은 내용을 확인하지 않는다.</b> 실제 스키마가 V1과 달라도
    # 그냥 통과시킨다. 그래서 이것만 믿으면 안 되고, 아래 ddl-auto: validate가 짝이다 —
    # 엔티티와 실제 테이블이 어긋나면 그쪽에서 기동이 멈춘다.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # 스키마를 <b>만들지 않고 대조만</b> 한다. 엔티티에 컬럼을 추가하고 마이그레이션 파일을
      # 빠뜨리면 여기서 기동이 실패한다 — 운영에서 조용히 틀어지는 것보다 배포가 멈추는 게 낫다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 유실을 막기 위해 모든 ISR의 응답을 기다린다 (돈이 걸린 이벤트이므로)
      acks: all
      retries: 3
    consumer:
      group-id: account-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 서비스를 새로 붙였을 때 이미 쌓인 이벤트부터 처리하도록 한다.
      auto-offset-reset: earliest

# @Scheduled가 도는 스레드 풀. <b>기본값이 1이다.</b>
#
# 2026-08-27에 이것 때문에 시스템이 통째로 멈췄다. 상대 은행 조회 루프를 넣었더니
# 그게 스레드 하나를 오래 붙들었고, <b>같은 스레드로 도는 Outbox 릴레이가 굶었다.</b>
# 미발행이 7,368건까지 쌓이고 종결 성공률이 0.00이 됐다 — 내부 송금까지 전부.
#
# 느린 외부 호출을 스케줄러에서 하는 한, 풀이 1이면 <b>그 하나가 전부를 막는다.</b>
# 격벽으로 컨슈머 스레드는 지켰는데 정작 스케줄러가 새 단일 자원이 된 셈이다.
#
# 4로 잡은 이유: Outbox 릴레이 · 조회 루프 · 지표 갱신에 각각 하나씩 쓰고 하나를 남긴다.
spring.task.scheduling.pool.size: 4

server:
  port: 8081

# 상대 은행 (Phase 6.5). 여기 없는 은행으로는 송금할 수 없다 —
# 주소를 모르는 곳으로 보내면 돈이 어디로 갔는지 아무도 모르게 되므로 접수가 실패해야 한다.
remittance:
  external-bank:
    connect-timeout: 1s
    # ⚠️ 이 시스템에서 가장 무거운 설정이다.
    # 이 값을 넘기면 우리는 <b>결과를 모르는 채로</b> 남는다. 짧으면 멀쩡히 처리 중인 요청을
    # 자꾸 모르는 상태로 만들고, 길면 느린 상대가 우리 컨슈머 스레드를 그만큼 붙든다.
    # 어느 쪽이든 대가가 있어 "안전한 기본값"이 없다 — 재보고 정해야 하는 값이다.
    read-timeout: 3s
    urls:
      KB: http://localhost:8086
    # 답을 못 받은 건을 다시 물어보는 주기 (Phase 6.5 Step 2b).
    # 재시도가 아니라 조회다 — 다시 보내는 것은 "안 갔다"를 전제로 하는데 우리는 그걸 모른다.
    # 격벽 — 외부 호출이 컨슈머 스레드를 몇 개까지 붙들 수 있나.
    #
    # 2026-08-27 실측: 상대가 2초 느려지자 <b>내부</b> 송금 종결 p99가
    # 3,071 → 58,790ms가 됐다. 입금 리스너 하나가 내부 입금과 외부 호출을 같이
    # 처리하는데, 외부 6건/s × 2초 = 12 스레드-초/초로 스레드 6개를 다 써버린다.
    #
    # 2로 잡은 이유: 리스너 스레드가 6개이므로 최악에도 <b>4개는 내부용으로 남는다.</b>
    # 격벽은 처리량을 만들어주지 않는다 — <b>피해를 가두는 것</b>이 목적이다.
    bulkhead:
      capacity: 2
    inquiry:
      interval-ms: 1000
      # 답 없는 상대를 초당 두드려봐야 소용없다. 지수적으로 늘리되 상한을 둔다 —
      # 무한정 미루면 풀렸는데도 한참 모른 채로 남는다.
      base-backoff: 2s
      max-backoff: 1m
      # 이만큼 지나도 안 풀리면 사람이 봐야 한다. 고객 돈이 어디 있는지 모르는 상태다.
      stuck-after: 5m

outbox:
  relay:
    interval-ms: 500

# Actuator: 헬스체크·메트릭 노출.
# health 상세는 K8s probe(Phase 7), prometheus는 메트릭 수집(Phase 9)에서 쓴다.
# 운영에서는 별도 포트/네트워크로 분리해야 하지만, 로컬 단계에서는 앱 포트에 함께 둔다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
