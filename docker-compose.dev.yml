# 로컬 개발용 인프라(DB·Redis 등)만 띄우는 compose 파일.
# 서비스 자체를 컨테이너로 올리는 정식 docker-compose.yml은 Phase 6에서 별도로 구성한다.
services:
  mysql:
    image: mysql:8.0
    container_name: remittance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - remittance-mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: remittance-mongo
    environment:
      MONGO_INITDB_DATABASE: ledger_db
    ports:
      - "27017:27017"
    volumes:
      - remittance-mongo-data:/data/db

  # Phase 2 Step 2: 계좌별 동시 이체를 직렬화하는 분산 락 저장소
  redis:
    image: redis:7-alpine
    container_name: remittance-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  remittance-mysql-data:
  remittance-mongo-data:
