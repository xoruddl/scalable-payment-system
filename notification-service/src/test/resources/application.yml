spring:
  application:
    name: notification-service
  # datasource / kafka 접속 정보는 AbstractIntegrationTest가 컨테이너 값으로 주입한다.
  jpa:
    hibernate:
      # 컨테이너가 새로 뜨면 스키마가 비어 있고, Flyway가 V1을 실행해 만든다.
      # Hibernate는 그 결과를 <b>대조만</b> 한다 — 여기서 실패하면 마이그레이션 파일이
      # 엔티티를 따라오지 못한 것이다. 운영에서 터질 일을 테스트에서 먼저 잡는다.
      ddl-auto: validate
    open-in-view: false

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
