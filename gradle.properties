# 모듈이 여덟 개인데 순차로 빌드하고 있었다. 서로 의존하지 않는 모듈은 같이 돌린다.
org.gradle.parallel=true

# 입력이 같으면 태스크 결과를 재사용한다. CI에서는 setup-gradle이 이 캐시를 실어 나른다.
org.gradle.caching=true

# 설정 단계(빌드 스크립트 평가) 결과를 재사용한다. Gradle이 매 실행마다 켜라고 권했다.
org.gradle.configuration-cache=true

# 위를 켜면 워커가 늘어 기본 힙으로는 모자란다.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
