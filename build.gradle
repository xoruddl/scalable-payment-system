plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
	/*
	 * Phase 6.5의 상대 은행만 Kotlin이다 (external-bank-service).
	 *
	 * 플러그인 버전은 여기 적어야 한다. Boot의 의존성 관리는 Kotlin <b>라이브러리</b> 버전만
	 * 맞춰주고, Gradle 플러그인 버전까지 정해주지는 않는다.
	 *
	 * kotlin.plugin.spring이 필요한 이유: Kotlin 클래스는 기본이 final인데
	 * Spring의 프록시(@Transactional, @Configuration)는 상속을 쓴다.
	 * 이 플러그인이 스프링 애너테이션이 붙은 클래스를 open으로 열어준다.
	 */
	id 'org.jetbrains.kotlin.jvm' version '2.3.21' apply false
	id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21' apply false
	id 'org.jetbrains.kotlin.plugin.jpa' version '2.3.21' apply false
}

/**
 * git 정보를 빌드에 새겨 넣기 위해 한 번만 읽는다.
 *
 * git이 없거나 저장소 밖에서 빌드하는 경우(소스 tarball 등)에도 빌드가 깨지면 안 되므로
 * 실패하면 조용히 'unknown'으로 떨어진다 — 버전 정보 때문에 빌드를 못 하는 건 본말전도다.
 */
def gitValue = { String property, List<String> args ->
	/*
	 * 밖에서 넘겨준 값이 있으면 그걸 먼저 쓴다.
	 *
	 * 빌드가 항상 git이 있는 곳에서 도는 게 아니다. 컨테이너 안에서 빌드하면
	 * (홈서버처럼 호스트에 JDK를 안 깔았을 때, 그리고 Phase 7의 이미지 빌드에서)
	 * git 바이너리가 없어 커밋이 조용히 'unknown'으로 떨어진다.
	 * 그러면 /actuator/info가 "지금 떠 있는 게 어느 커밋이냐"에 답을 못 하고,
	 * build-info를 심어둔 이유 자체가 사라진다.
	 *
	 *   ./gradlew -PgitCommit=$(git rev-parse --short=12 HEAD) ...
	 */
	if (project.hasProperty(property)) {
		return project.property(property)
	}
	try {
		def out = providers.exec { commandLine(args) }.standardOutput.asText.get().trim()
		return out.isEmpty() ? 'unknown' : out
	} catch (Exception ignored) {
		// git이 없어도 빌드는 되어야 한다. 버전 정보 때문에 빌드를 못 하는 건 본말전도다.
		return 'unknown'
	}
}

ext {
	gitCommit = gitValue('gitCommit', ['git', 'rev-parse', '--short=12', 'HEAD'])
	gitBranch = gitValue('gitBranch', ['git', 'rev-parse', '--abbrev-ref', 'HEAD'])

	/*
	 * springdoc은 Boot의 BOM이 관리하지 않으므로 버전을 직접 고정한다.
	 *
	 * ⚠️ 2.x는 Boot 3용이다. Boot 4(Spring Framework 7 · Jackson 3)에는 3.x를 써야 한다 —
	 * 두 줄기가 같은 날 함께 릴리스되므로 최신 숫자만 보고 2.9.0을 고르면 조용히 어긋난다.
	 */
	springdocVersion = '3.1.0'
}

allprojects {
	group = 'com.remittance'

	/*
	 * 아티팩트 버전은 제품 버전이지 "무엇이 배포됐나"의 답이 아니다.
	 * 그 답은 build-info가 한다 — 아래 bootBuildInfo 설정 참고.
	 */
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	dependencies {
		// 모든 서비스가 헬스체크·메트릭 엔드포인트를 노출한다.
		// Phase 7 K8s의 liveness/readiness probe와 Phase 9 Prometheus 스크래핑의 전제조건.
		implementation 'org.springframework.boot:spring-boot-starter-actuator'
		// /actuator/prometheus 엔드포인트는 이 레지스트리가 있어야 생긴다.
		runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testCompileOnly 'org.projectlombok:lombok'
		testAnnotationProcessor 'org.projectlombok:lombok'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	/*
	 * Spring Boot 모듈에만 build-info를 심는다.
	 *
	 * 이게 없으면 "지금 떠 있는 이 서비스가 어느 커밋인가"에 답할 방법이 없다.
	 * 아티팩트 버전은 0.0.1-SNAPSHOT으로 고정이라 커밋을 구분하지 못하고,
	 * 이미지 태그는 배포한 사람만 안다. 실행 중인 프로세스에 직접 물어볼 수 있어야 한다.
	 *
	 *   GET /actuator/info  →  build.commit / build.branch / build.time
	 *
	 * Actuator의 info 엔드포인트는 각 서비스 application.yml에서 이미 열려 있다.
	 */
	plugins.withId('org.springframework.boot') {
		springBoot {
			buildInfo {
				properties {
					additional.put('commit', rootProject.ext.gitCommit)
					additional.put('branch', rootProject.ext.gitBranch)
				}
			}
		}
	}

	// 기본 test에서는 'reproduction' 태그를 제외한다.
	// 아직 못 고친 문제를 일부러 red로 두는 재현 테스트라, 포함하면 CI가 상시 실패해
	// "빌드가 깨졌다"는 신호로서의 가치를 잃는다. 해당 Step에서 고쳐지면 태그를 떼면 된다.
	tasks.named('test') {
		useJUnitPlatform {
			excludeTags 'reproduction'
		}
	}

	/*
	 * Docker 없이 몇 초 만에 끝나는 것만 돌린다: ./gradlew unitTest
	 *
	 * 통합 테스트는 Testcontainers로 MySQL·MongoDB·Redis·Kafka를 띄우느라 느리다.
	 * PR마다 그걸 다 기다리면 피드백이 늦어지고, Phase 5에서 부하 테스트까지 붙으면 더 나빠진다.
	 * CI는 이걸 먼저 통과시킨 뒤에야 통합 테스트로 넘어간다 — 오타 하나 때문에
	 * 컨테이너를 띄우고 있을 이유가 없다.
	 *
	 * 'integration' 태그는 각 서비스의 AbstractIntegrationTest에 달려 있고,
	 * JUnit의 @Tag는 상속되므로 그걸 상속한 테스트는 자동으로 붙는다.
	 */
	tasks.register('unitTest', Test) {
		group = 'verification'
		description = 'Docker가 필요 없는 빠른 테스트만 실행한다'
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		useJUnitPlatform {
			excludeTags 'integration', 'reproduction'
		}
	}

	// 재현 테스트만 따로 돌려본다: ./gradlew reproductionTest
	// 아직 red인 게 정상이므로 실패해도 빌드를 세우지 않는다.
	tasks.register('reproductionTest', Test) {
		group = 'verification'
		description = '아직 해결되지 않은 문제를 재현하는 테스트 (현재는 실패하는 것이 정상)'
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		useJUnitPlatform {
			includeTags 'reproduction'
		}
		ignoreFailures = true
	}
}
