spring:
  application:
    name: config-server

server:
  port: 8888

# Phase 4에서 @EnableConfigServer 및 Git 기반 config repo 연동 설정 추가 예정

# Actuator: 헬스체크·메트릭 노출.
# health 상세는 K8s probe(Phase 7), prometheus는 메트릭 수집(Phase 9)에서 쓴다.
# 운영에서는 별도 포트/네트워크로 분리해야 하지만, 로컬 단계에서는 앱 포트에 함께 둔다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
