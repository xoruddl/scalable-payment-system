plugins {
	id 'org.springframework.boot'
}

/*
 * Spring Cloud는 Boot BOM이 관리하지 않으므로 릴리스 트레인을 직접 고정한다.
 *
 * ⚠️ 2025.1.3은 Boot <b>4.0.8</b>을 기준으로 만들어졌고 이 저장소는 4.1.0이다.
 * Spring Framework 줄기(7.0.x)가 같아 붙지만, <b>같은 minor가 아니라는 것은 알고 있어야 한다</b> —
 * 다음 Boot 업그레이드에서 여기가 먼저 깨질 자리다.
 * 실제로 뜨는지는 ConfigServerApplicationTests가 확인한다.
 */
ext {
	springCloudVersion = '2025.1.3'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-config-server'
	// Config Server가 실제로 설정을 내는지 HTTP로 물어보는 테스트에 쓴다.
	// Boot 4는 MockMvc 자동 설정이 별도 모듈이라 starter-test만으로는 안 온다.
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
}
