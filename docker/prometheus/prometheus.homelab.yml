# 홈서버(측정 전용 리눅스 머신)용 수집 설정. docker-compose.homelab.yml이 이걸 마운트한다.
# docker/prometheus/prometheus.yml과 같고 node-exporter 잡 하나가 더 있다.
# (노트북에는 node-exporter가 없어서 그쪽 설정에 넣으면 타깃이 영영 down으로 남는다.)
#
# 원본 주석:
# 로컬 관측 스택의 수집 설정 (Phase 5 Step 2).
#
# 서비스는 아직 컨테이너가 아니라 호스트에서 bootRun/bootJar로 뜬다(컨테이너화는 Phase 7).
# 그래서 Prometheus 컨테이너가 호스트를 거꾸로 긁어야 하고, 그 주소가 host.docker.internal이다.
# Docker Desktop(mac/win)에는 기본으로 있고 Linux에는 없어서 compose에서 extra_hosts로 만들어 준다.
# Phase 7에서 서비스가 컨테이너로 들어오면 이 파일의 타깃은 서비스 이름으로 바뀐다.

global:
  # 부하 시나리오가 2~4분짜리라 기본값 15초로는 계단이 뭉개진다.
  # 5초면 4분 구간에 48점이 찍혀 램프업 모양이 보인다.
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: remittance
    metrics_path: /actuator/prometheus
    static_configs:
      # service 라벨을 여기서 붙인다. 애플리케이션이 스스로 붙이지 않기 때문이다
      # (Micrometer는 spring.application.name을 태그로 달아주지 않는다 — 확인함).
      # 이게 없으면 대시보드에서 어느 서비스의 숫자인지 구분할 수 없다.
      - targets: ['host.docker.internal:8081']
        labels: { service: account }
      - targets: ['host.docker.internal:8082']
        labels: { service: transfer }
      - targets: ['host.docker.internal:8083']
        labels: { service: ledger }
      - targets: ['host.docker.internal:8084']
        labels: { service: reconciliation }
      - targets: ['host.docker.internal:8085']
        labels: { service: notification }
      # Phase 6.5 — 상대 은행. 우리 조직이 아니지만 지표는 봐야 한다.
      # 느린 상대가 우리를 어떻게 묶는지 보려면 양쪽을 나란히 놓아야 한다.
      - targets: ['host.docker.internal:8086']
        labels: { service: external-bank }

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 호스트 자체의 CPU·메모리·디스크. 홈서버(리눅스)에서만 띄운다.
  #
  # 2026-08-22 baseline에서 시나리오 하나를 버렸다 — 지연이 큰데 원인이 앱인지 호스트인지
  # 몰라서였다. 나중에 확인해보니 호스트 CPU가 91%였고 부하 생성기가 앱의 CPU를 뺏고
  # 있었다. 그 판단을 처음부터 화면에서 할 수 있어야 한다.
  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels: { service: host }
