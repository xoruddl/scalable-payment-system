name: build

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
  pull_request:
    branches: [main, develop]

# 같은 브랜치에 새 푸시가 오면 진행 중이던 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 워크플로 파일 자체의 오타·잘못된 액션 참조를 먼저 걸러낸다.
  # 빌드보다 훨씬 빨리 끝나므로 별도 job으로 병렬 실행한다.
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actionlint 공식 이미지를 직접 쓴다 (래퍼 액션을 거치지 않음).
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 툴체인 자동 프로비저닝(foojay)이 있긴 하지만, 러너에 21을 미리 깔아두면
      # 매 실행마다 JDK를 내려받지 않아 빌드가 빨라진다.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers가 Docker를 쓰는데, ubuntu-latest 러너에는 이미 데몬이 떠 있다.
      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain

      # 실패한 테스트의 리포트를 받아볼 수 있게 남긴다.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          retention-days: 7
