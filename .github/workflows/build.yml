name: build

on:
  # push는 통합 브랜치에만 건다. feature/release 브랜치를 여기 넣으면
  # PR을 연 뒤의 모든 푸시가 push와 pull_request 양쪽에 걸려 같은 SHA를 두 번 빌드한다
  # (2026-09-05 확인: 3ebb464 하나에 run 두 개, build 5m42s + 6m6s).
  # feature/release는 pull_request가 이미 덮으므로 잃는 검사는 없다 —
  # PR을 열기 전의 푸시만 CI를 안 타는데, 그건 어차피 리뷰 대상이 아니다.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 같은 브랜치에 새 푸시가 오면 진행 중이던 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 워크플로 파일 자체의 오타·잘못된 액션 참조를 먼저 걸러낸다.
  # 빌드보다 훨씬 빨리 끝나므로 별도 job으로 병렬 실행한다.
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actionlint 공식 이미지를 직접 쓴다 (래퍼 액션을 거치지 않음).
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  # Docker가 필요 없는 테스트만. 몇 초면 끝난다.
  # 오타나 단순 회귀 때문에 Testcontainers로 MySQL·MongoDB·Redis·Kafka를 띄우고 있을 이유가 없다.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # bootBuildInfo가 커밋 해시를 읽는다. depth 1이면 rev-parse는 되지만
          # 브랜치 이름은 detached HEAD라 'HEAD'로 나온다 — 그래도 무방하다.
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 이 액션은 기본 브랜치가 아니면 캐시를 읽기만 한다. 그런데 이 저장소는
          # 작업이 거의 develop에서 일어나므로, 기본값대로 두면 캐시가 채워지지 않아
          # 사실상 꺼져 있는 것과 같다 (2026-08-22 실행 로그에서 cache-read-only: true 확인).
          # develop에서도 쓰게 열어 다음 실행이 이득을 보게 한다.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # --no-daemon을 쓰지 않는다. setup-gradle이 job 끝에 데몬을 정리해주고,
      # 데몬이 있어야 Gradle이 configuration cache를 재사용할 수 있다.
      - name: Unit tests
        run: ./gradlew unitTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/unitTest'
          retention-days: 7

  # 통합 테스트까지 포함한 전체 빌드. Testcontainers가 Docker를 쓰는데
  # ubuntu-latest 러너에는 이미 데몬이 떠 있다.
  build:
    runs-on: ubuntu-latest
    # 빠른 쪽이 먼저 통과해야 느린 쪽을 시작한다.
    needs: unit
    steps:
      - uses: actions/checkout@v4

      # 툴체인 자동 프로비저닝(foojay)이 있긴 하지만, 러너에 21을 미리 깔아두면
      # 매 실행마다 JDK를 내려받지 않아 빌드가 빨라진다.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 이 액션은 기본 브랜치가 아니면 캐시를 읽기만 한다. 그런데 이 저장소는
          # 작업이 거의 develop에서 일어나므로, 기본값대로 두면 캐시가 채워지지 않아
          # 사실상 꺼져 있는 것과 같다 (2026-08-22 실행 로그에서 cache-read-only: true 확인).
          # develop에서도 쓰게 열어 다음 실행이 이득을 보게 한다.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Build and test
        run: ./gradlew build --console=plain

      # 무엇이 빌드됐는지를 실행 로그에서 바로 확인할 수 있게 남긴다.
      # Phase 7에서 이미지를 구울 때는 이 커밋 해시가 그대로 태그가 된다.
      - name: Report build info
        run: |
          {
            echo '### Build info'
            echo '```properties'
            cat account-service/build/resources/main/META-INF/build-info.properties
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 실패한 테스트의 리포트를 받아볼 수 있게 남긴다.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          retention-days: 7
