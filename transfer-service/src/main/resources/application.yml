spring:
  application:
    name: transfer-service
  datasource:
    url: jdbc:mysql://localhost:3306/transfer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    hikari:
      # Phase 6 Step 2 — baseline이 지목한 첫 병목.
      #
      # 2026-08-22 실측(홈서버): 접수 최대 111 req/s에서 p99가 8.9초까지 갔는데,
      # 그때 HikariCP <b>pending이 193</b>이었다. Tomcat 기본 최대 스레드가 200이니
      # 요청 스레드 200개 중 193개가 커넥션 10개(기본값)를 기다리며 줄 서 있었다는 뜻이다.
      # 접수는 INSERT 몇 번이 전부인데도 느린 이유가 일이 무거워서가 아니라 자리가 없어서다.
      #
      # 왜 30인가
      #   접수 한 건은 커넥션을 <b>세 번</b> 잡는다 — 키 선점 / 송금+Outbox 저장 / 키 결과 기록이
      #   각각 다른 트랜잭션이다(Step 6b가 크래시 지점을 구분하려고 나눈 구조라 합칠 수 없다).
      #   실측에서 111 req/s × 3 = 초당 약 333 트랜잭션을 커넥션 10개가 처리했으므로
      #   트랜잭션 하나가 커넥션을 약 30ms 쥔다. 같은 점유 시간이면 30개로 초당 약 1,000건,
      #   즉 접수 300 req/s 언저리가 된다.
      #
      # 늘리기만 하면 되는 게 아니다. 커넥션은 결국 MySQL의 동시 실행 수라, 너무 키우면
      # DB 안에서 경합이 옮겨간다. 그래서 "무조건 크게"가 아니라 <b>재고 한 단계 올린다.</b>
      maximum-pool-size: 30
      # 놀 때도 유지할 최소치. 부하가 계단식으로 오르므로 매번 새로 만들지 않게 둔다.
      minimum-idle: 10
  # 스키마는 앱이 아니라 여기 있는 SQL이 만든다 (DECISIONS.md 교체 4번).
  #   src/main/resources/db/migration/V1__baseline.sql
  flyway:
    # 이미 테이블이 있는데 이력 테이블이 없으면, V1을 실행하는 대신
    # "지금 이 상태가 V1이다"라고 도장만 찍고 넘어간다.
    #
    # 이게 없으면 <b>기존 볼륨에서 뜨는 순간 기동이 실패한다</b> — Flyway는 빈 스키마를
    # 기대하는데 테이블이 이미 있으니 V1의 CREATE TABLE이 충돌한다. 홈서버 DB에는
    # 지금까지 쌓인 데이터가 있어서 지우고 시작할 수 없으므로 이 다리가 필요하다.
    #
    # 대가는 명확하다. <b>도장은 내용을 확인하지 않는다.</b> 실제 스키마가 V1과 달라도
    # 그냥 통과시킨다. 그래서 이것만 믿으면 안 되고, 아래 ddl-auto: validate가 짝이다 —
    # 엔티티와 실제 테이블이 어긋나면 그쪽에서 기동이 멈춘다.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # 스키마를 <b>만들지 않고 대조만</b> 한다. 엔티티에 컬럼을 추가하고 마이그레이션 파일을
      # 빠뜨리면 여기서 기동이 실패한다 — 운영에서 조용히 틀어지는 것보다 배포가 멈추는 게 낫다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 유실을 막기 위해 모든 ISR의 응답을 기다린다 (돈이 걸린 이벤트이므로)
      acks: all
      retries: 3
    consumer:
      group-id: transfer-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 서비스를 새로 붙였을 때 이미 쌓인 이벤트부터 처리하도록 한다.
      auto-offset-reset: earliest

server:
  port: 8082

outbox:
  relay:
    interval-ms: 500

# Actuator: 헬스체크·메트릭 노출.
# health 상세는 K8s probe(Phase 7), prometheus는 메트릭 수집(Phase 9)에서 쓴다.
# 운영에서는 별도 포트/네트워크로 분리해야 하지만, 로컬 단계에서는 앱 포트에 함께 둔다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
