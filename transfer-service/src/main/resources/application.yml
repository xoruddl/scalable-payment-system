spring:
  application:
    name: transfer-service
  datasource:
    url: jdbc:mysql://localhost:3306/transfer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 유실을 막기 위해 모든 ISR의 응답을 기다린다 (돈이 걸린 이벤트이므로)
      acks: all
      retries: 3
    consumer:
      group-id: transfer-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 서비스를 새로 붙였을 때 이미 쌓인 이벤트부터 처리하도록 한다.
      auto-offset-reset: earliest

server:
  port: 8082

outbox:
  relay:
    interval-ms: 500

# Actuator: 헬스체크·메트릭 노출.
# health 상세는 K8s probe(Phase 7), prometheus는 메트릭 수집(Phase 9)에서 쓴다.
# 운영에서는 별도 포트/네트워크로 분리해야 하지만, 로컬 단계에서는 앱 포트에 함께 둔다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
