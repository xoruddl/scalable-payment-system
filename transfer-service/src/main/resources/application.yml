spring:
  application:
    name: transfer-service
  datasource:
    url: jdbc:mysql://localhost:3306/transfer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

services:
  account:
    base-url: http://localhost:8081
  ledger:
    base-url: http://localhost:8083
