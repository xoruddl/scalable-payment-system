spring:
  application:
    name: transfer-service
  # datasource / kafka 접속 정보는 AbstractIntegrationTest가 컨테이너 값으로 주입한다.
  jpa:
    hibernate:
      # 여러 테스트 컨텍스트가 같은 컨테이너 DB를 공유하므로 create-drop은 쓰지 않는다.
      # 한 컨텍스트가 내려가며 테이블을 지우면 살아있는 다른 컨텍스트가 깨진다.
      ddl-auto: update
    open-in-view: false

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

services:
  account:
    base-url: http://localhost:18081
  ledger:
    base-url: http://localhost:18083

outbox:
  relay:
    # Kafka가 없는 테스트 컨텍스트에서 릴레이가 계속 재시도하지 않도록 기본은 끔.
    # Outbox 발행을 검증하는 테스트만 켠다.
    enabled: false
    interval-ms: 200
