# 홈서버(측정 전용 리눅스 머신)용 오버라이드.
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.homelab.yml up -d
#
# 노트북과 무엇이 다른가:
#
#   1. 메모리를 명시적으로 묶는다. 이 머신은 CPU는 남고 메모리가 빠듯하다
#      (Ryzen 5 3600 6코어/12스레드, 15GB). 기본값대로 두면 MongoDB가 WiredTiger 캐시로
#      (RAM-1GB)의 50%인 약 7GB를 가져가고, JVM 다섯 개가 각각 RAM의 1/4을 힙 상한으로
#      잡으려 든다. 합치면 물리 메모리를 넘겨 스왑으로 떨어지고, 그러면 측정값이 통째로
#      쓰레기가 된다. **성능을 재려는 머신에서 스왑은 측정 실패다.**
#
#   2. node-exporter를 함께 띄운다. 2026-08-22 baseline에서 "호스트 CPU가 91%였다"를
#      뒤늦게 알아채느라 시나리오 하나를 버렸다. 호스트 지표는 처음부터 같이 봐야 한다.
#
#   3. Prometheus 보존 기간을 줄인다. 5초 간격 + 히스토그램 버킷이라 하루 수백 MB씩 쌓인다.
#
# 서비스(account/transfer/...)는 여기 없다. `scripts/homelab-services.sh`가 띄운다.

services:
  mysql:
    mem_limit: 1500m
    command: >
      --innodb-buffer-pool-size=1G
      --max-connections=300

  mongo:
    mem_limit: 1500m
    # 지정하지 않으면 (RAM-1GB)의 50%를 캐시로 잡는다. 이 머신에서는 약 7GB다.
    command: --wiredTigerCacheSizeGB 1

  redis:
    mem_limit: 256m

  kafka:
    mem_limit: 1500m
    environment:
      # KRaft 단일 노드에 1GB면 충분하다. 기본값은 머신 크기를 따라 커진다.
      KAFKA_HEAP_OPTS: -Xmx1g -Xms1g

  prometheus:
    mem_limit: 2g
    volumes:
      - ./docker/prometheus/prometheus.homelab.yml:/etc/prometheus/prometheus.yml:ro
      - remittance-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 노트북에서는 15일이었지만, 여기서는 상시로 돌 수 있어 디스크를 아낀다.
      # 측정 기록 자체는 PROGRESS.md에 숫자로 남는다.
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle

  grafana:
    mem_limit: 512m

  # 호스트 자체의 CPU·메모리·디스크·네트워크. 리눅스에서만 의미가 있어 여기에만 둔다.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: remittance-node-exporter
    mem_limit: 128m
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      # 컨테이너 파일시스템은 볼 필요가 없다. 시계열만 늘어난다.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker)($$|/)
