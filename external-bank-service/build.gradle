plugins {
	id 'org.springframework.boot'
	id 'org.jetbrains.kotlin.jvm'
	// Kotlin 클래스는 기본이 final이라 Spring 프록시가 상속을 못 한다. 이게 열어준다.
	id 'org.jetbrains.kotlin.plugin.spring'
	// JPA 엔티티에 필요한 기본 생성자를 만들어준다.
	id 'org.jetbrains.kotlin.plugin.jpa'
    id "org.jetbrains.kotlin.plugin.lombok"
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// API 문서를 손으로 쓰지 않고 코드에서 낸다 (Phase 4). 버전은 루트 build.gradle에 고정.
	// 상대 은행은 남의 시스템이라 더 필요하다 — 우리가 무엇을 부를 수 있는지가 계약이다.
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Jackson이 Kotlin의 data class와 널 안전성을 이해하게 한다.
	// 없으면 널 불가 필드에 null이 들어가도 조용히 통과한다.
	implementation 'tools.jackson.module:jackson-module-kotlin'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

kotlin {
	// 나머지 모듈과 같은 21. 루트의 java 툴체인과 맞춰야 한다.
	jvmToolchain(21)
	compilerOptions {
		/*
		 * 원래 allWarningsAsErrors = true 였다. <b>값을 한 번 했다</b> —
		 * Testcontainers의 옛 MySQLContainer가 deprecated인 것을 여기서 잡았다
		 * (Java 모듈들은 경고만 나서 아직 쓰고 있다).
		 *
		 * 그런데 껐다. Spring Boot의 Gradle 플러그인이 Kotlin Lombok 서브플러그인을
		 * 자동으로 붙이고, 그게 "experimental feature" 경고를 낸다.
		 * <b>내 코드와 무관하고 내 쪽에서 끌 수도 없는 경고</b>다.
		 * (Lombok 의존성을 빼도 서브플러그인은 그대로 붙는다 — 확인함.)
		 *
		 * 도구가 내는 소음 때문에 빌드가 깨지면, 정작 내 코드의 경고를 볼 이유가 사라진다.
		 * 경고는 그대로 출력되므로 CI 로그에서는 보인다.
		 */
		allWarningsAsErrors = false
	}
}
repositories {
    mavenCentral()
}

