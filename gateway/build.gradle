plugins {
	id 'org.springframework.boot'
}

/*
 * Spring Cloud는 Boot BOM이 관리하지 않으므로 릴리스 트레인을 직접 고정한다.
 *
 * ⚠️ 2025.1.3은 Boot <b>4.0.8</b> 기준이고 이 저장소는 4.1.0이다.
 * Spring Framework 줄기(7.0.x)가 같아 붙지만, 다음 Boot 업그레이드에서 여기가 먼저 깨질 자리다.
 */
ext {
	springCloudVersion = '2025.1.3'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	/*
	 * ⚠️ 아티팩트 이름이 바뀌었다. 예전 `spring-cloud-starter-gateway`는 4.3.5에서 멈췄고,
	 * 5.x부터는 서버 구현을 이름에 박는다 — WebFlux(논블로킹)와 WebMVC(서블릿) 중 고르는 것이다.
	 * 이 게이트웨이는 <b>모든 요청을 뒤로 흘려보내기만 하므로</b> 스레드를 붙들지 않는 쪽이 맞다.
	 */
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

	testImplementation 'org.springframework.boot:spring-boot-webtestclient'
}
