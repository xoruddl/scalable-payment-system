spring:
  application:
    name: reconciliation-service
  # datasource 접속 정보는 AbstractIntegrationTest가 컨테이너 값으로 주입한다.
  jpa:
    hibernate:
      # 컨테이너가 새로 뜨면 스키마가 비어 있고, Flyway가 V1을 실행해 만든다.
      # Hibernate는 그 결과를 <b>대조만</b> 한다 — 여기서 실패하면 마이그레이션 파일이
      # 엔티티를 따라오지 못한 것이다. 운영에서 터질 일을 테스트에서 먼저 잡는다.
      ddl-auto: validate
    open-in-view: false

reconciliation:
  page-size: 2
  unsettled-after: 2m
  key-stranded-after: 10m
  tolerance: 0
  scheduler:
    # 테스트가 상태를 만드는 동안 배치가 끼어들면 검증이 흔들린다. 필요한 테스트만 켠다.
    enabled: false
